<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#10b981" opacity="0.08" />
  <circle cx="1100" cy="530" r="120" fill="#14b8a6" opacity="0.08" />
  <circle cx="950" cy="120" r="50" fill="#a855f7" opacity="0.1" />
  
  <!-- Medical cross icon -->
  <g transform="translate(140, 200)">
    <rect x="40" y="0" width="40" height="120" rx="8" fill="url(#accent)" />
    <rect x="0" y="40" width="120" height="40" rx="8" fill="url(#accent)" />
  </g>
  
  <!-- Main title -->
  <text x="320" y="270" font-family="Georgia, serif" font-size="96" font-weight="bold" fill="white">
    PflegePro
  </text>
  
  <!-- Subtitle -->
  <text x="320" y="350" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="#94a3b8">
    Deine Lern-App für die Pflegeausbildung
  </text>
  
  <!-- Features bar -->
  <g transform="translate(140, 470)">
    <rect x="0" y="0" width="920" height="80" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" fill="#10b981">📚</text>
    <text x="90" y="52" font-family="Arial, sans-serif" font-size="22" fill="white">Lektionen</text>
    
    <text x="270" y="50" font-family="Arial, sans-serif" font-size="28" fill="#a855f7">🎯</text>
    <text x="320" y="52" font-family="Arial, sans-serif" font-size="22" fill="white">Quiz</text>
    
    <text x="440" y="50" font-family="Arial, sans-serif" font-size="28" fill="#3b82f6">🔊</text>
    <text x="490" y="52" font-family="Arial, sans-serif" font-size="22" fill="white">Fachbegriffe</text>
    
    <text x="700" y="50" font-family="Arial, sans-serif" font-size="28" fill="#f59e0b">🧠</text>
    <text x="750" y="52" font-family="Arial, sans-serif" font-size="22" fill="white">Wiederholung</text>
  </g>
  
  <!-- URL -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#10b981" text-anchor="middle">
    pflegepro.eu
  </text>
</svg>
